<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación</title>
<!--
  Visor de presentaciones para el dashboard: muestra una diapo a la vez, escalada a 16:9,
  sin barras de herramientas. Las flechas aparecen solo al pasar el mouse.

  Dos modos (por query string):
    ?images=/class-materials/clase-6/slides/s-{n}.jpg&count=56&pad=2
        Diapos como imágenes ({n} se reemplaza por el número, con ceros a la izquierda hasta `pad`).
    ?html=/class-materials/clase-7/personal-agents/presentacion.html&w=1600&h=900
        Deck HTML con una sección .slide por diapo. Se carga a w×h y se escala para que entre.

  Teclado: ← → (también espacio, PageUp/PageDown, Inicio/Fin) y F para pantalla completa.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; overflow: hidden; background: #000; }
  #frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }

  /* Zonas de clic (solo en modo imágenes, para no tapar botones del deck HTML) */
  .zone { position: absolute; top: 0; bottom: 0; width: 50%; cursor: pointer; z-index: 2; }
  .zone.prev { left: 0; } .zone.next { right: 0; }

  .nav { position: absolute; top: 50%; translate: 0 -50%; z-index: 3; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 22px; line-height: 44px; text-align: center; cursor: pointer;
    opacity: 0; transition: opacity .2s; padding: 0; }
  .nav.prev { left: 12px; } .nav.next { right: 12px; }
  .nav:hover { background: rgba(0,0,0,.7); }
  .nav:disabled { display: none; }
  #count { position: absolute; left: 50%; bottom: 12px; translate: -50% 0; z-index: 3; padding: 4px 10px; border-radius: 999px;
    background: rgba(0,0,0,.45); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .2s; pointer-events: none; }
  body:hover .nav, body:hover #count, body.touch .nav { opacity: 1; }
  @media (hover: none) { .nav { opacity: .8; } }
</style>
</head>
<body>
<div id="stage"><div id="frame"></div></div>
<button class="nav prev" id="prev" aria-label="Diapositiva anterior">‹</button>
<button class="nav next" id="next" aria-label="Diapositiva siguiente">›</button>
<div id="count"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var frame = document.getElementById("frame");
  var countEl = document.getElementById("count");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var ratio = 16 / 9;
  var index = 0, total = 0;
  var mode = params.get("html") ? "html" : "images";

  // ---- Modo imágenes ----
  var img, urlFor;
  // ---- Modo HTML ----
  var inner, innerW = 1600, innerH = 900, slides = [];

  function layout() {
    var W = window.innerWidth, H = window.innerHeight, w = W, h = W / ratio;
    if (h > H) { h = H; w = H * ratio; }
    frame.style.width = w + "px";
    frame.style.height = h + "px";
    if (inner) inner.style.transform = "scale(" + (w / innerW) + ")";
  }

  function render() {
    countEl.textContent = total ? (index + 1) + " / " + total : "";
    prevBtn.disabled = index <= 0;
    nextBtn.disabled = index >= total - 1;
    if (mode === "images") {
      img.src = urlFor(index + 1);
      [index + 2, index].forEach(function (n) { if (n >= 1 && n <= total) { var p = new Image(); p.src = urlFor(n); } });
    } else if (slides[index]) {
      inner.contentWindow.scrollTo(0, slides[index].offsetTop);
    }
  }

  function go(i) {
    if (!total) return;
    var n = Math.max(0, Math.min(total - 1, i));
    if (n === index && mode === "images") return;
    index = n;
    render();
  }

  if (mode === "images") {
    var pattern = params.get("images");
    var pad = parseInt(params.get("pad") || "0", 10);
    total = parseInt(params.get("count") || "0", 10);
    urlFor = function (n) { var s = String(n); while (s.length < pad) s = "0" + s; return pattern.replace("{n}", s); };
    img = document.createElement("img");
    img.alt = "";
    img.draggable = false;
    frame.appendChild(img);
    var zp = document.createElement("div"); zp.className = "zone prev"; zp.onclick = function () { go(index - 1); };
    var zn = document.createElement("div"); zn.className = "zone next"; zn.onclick = function () { go(index + 1); };
    frame.appendChild(zp); frame.appendChild(zn);
    render();
  } else {
    innerW = parseInt(params.get("w") || "1600", 10);
    innerH = parseInt(params.get("h") || "900", 10);
    ratio = innerW / innerH;
    inner = document.createElement("iframe");
    inner.width = innerW;
    inner.height = innerH;
    inner.setAttribute("allow", "clipboard-write");
    inner.src = params.get("html");
    frame.appendChild(inner);
    inner.addEventListener("load", function () {
      var doc = inner.contentDocument;
      var st = doc.createElement("style");
      st.textContent = "html,body{overflow:hidden!important;scroll-behavior:auto!important;scroll-snap-type:none!important;scrollbar-width:none!important}" +
        "::-webkit-scrollbar{display:none!important}";
      doc.head.appendChild(st);
      slides = Array.prototype.slice.call(doc.querySelectorAll(".slide"));
      total = slides.length;
      // Si el deck se mueve con su propio teclado (foco adentro), mantener el contador sincronizado.
      inner.contentWindow.addEventListener("scroll", function () {
        var y = inner.contentWindow.scrollY, c = 0;
        for (var i = 0; i < slides.length; i++) { if (slides[i].offsetTop <= y + 8) c = i; }
        if (c !== index) { index = c; countEl.textContent = (index + 1) + " / " + total; prevBtn.disabled = index <= 0; nextBtn.disabled = index >= total - 1; }
      }, { passive: true });
      // Las teclas con foco adentro las maneja el deck (con scroll suave); las reemplazamos por un salto directo.
      doc.addEventListener("keydown", onKey, true);
      doc.addEventListener("touchstart", onTouchStart, { passive: true });
      doc.addEventListener("touchend", onTouchEnd, { passive: true });
      render();
    });
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key, handled = true;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " ") go(index + 1);
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp") go(index - 1);
    else if (k === "Home") go(0);
    else if (k === "End") go(total - 1);
    else if (k === "f" || k === "F") toggleFullscreen();
    else handled = false;
    if (handled) { e.preventDefault(); e.stopPropagation(); }
  }

  function toggleFullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }

  prevBtn.onclick = function () { go(index - 1); };
  nextBtn.onclick = function () { go(index + 1); };
  document.addEventListener("keydown", onKey);

  // Swipe en pantallas táctiles (también dentro del deck HTML)
  var sx = null;
  function onTouchStart(e) { document.body.classList.add("touch"); sx = e.touches[0].clientX; }
  function onTouchEnd(e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(index + (dx < 0 ? 1 : -1));
  }
  document.addEventListener("touchstart", onTouchStart, { passive: true });
  document.addEventListener("touchend", onTouchEnd, { passive: true });

  window.addEventListener("resize", layout);
  layout();
})();
</script>
</body>
</html>
